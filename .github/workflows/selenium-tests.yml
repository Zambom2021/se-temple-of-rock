name: Selenium Tests with Allure

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout do repositório de testes
      - name: Checkout test repo
        uses: actions/checkout@v3

      # Checkout do backend
      - name: Checkout backend repo
        uses: actions/checkout@v3
        with:
          repository: Zambom2021/temple-of-rock
          token: ${{ secrets.TEMPLE_TOKEN }}
          path: app

      # Subir backend em Docker
      - name: Start Backend
        run: |
          cd app
          docker compose up -d --build

          echo "Aguardando backend ficar pronto..."
          for i in {1..40}; do
            if curl -s http://localhost:9090/web/ >/dev/null; then
              echo "Backend OK"
              break
            fi
            echo "Backend ainda iniciando... ($i)"
            sleep 3
          done

      # Instalar Java
      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Instalar Google Chrome + ChromeDriver compatível
      - name: Install Google Chrome + ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb wget

          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

          # Chrome version
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)

          echo "Chrome version: $CHROME_VERSION"

          # Baixar ChromeDriver compatível
          DRIVER_URL="https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_MAJOR"
          DRIVER_VERSION=$(wget -qO- $DRIVER_URL)
          echo "ChromeDriver version: $DRIVER_VERSION"

          wget -q "https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip" -O driver.zip
          unzip -o driver.zip
          sudo mv chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

          chromedriver --version
          google-chrome --version

      # Instalar dependências Maven
      - name: Install Dependencies
        run: mvn -B install -DskipTests

      # Rodar testes Selenium (headless)
      - name: Run tests
        run: mvn -B test | tee test-output.log

      # Gerar Allure report apenas se houver resultados
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d target/allure-results ] && [ "$(ls -A target/allure-results)" ]; then
            echo "Generating Allure report..."
            mvn allure:report
          else
            echo "No allure results found, skipping report generation."
          fi

      # Upload resultados Allure
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # Upload relatório completo HTML
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      # Encerrar containers
      - name: Down Docker
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

      # Exibir logs
      - name: Show logs
        if: always()
        run: cat test-output.log