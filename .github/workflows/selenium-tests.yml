name: Selenium Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout do repositório de testes
      - name: Checkout test repo
        uses: actions/checkout@v3

      # Checkout do backend
      - name: Checkout backend repo
        uses: actions/checkout@v3
        with:
          repository: Zambom2021/temple-of-rock
          token: ${{ secrets.TEMPLE_TOKEN }}
          path: app

      # Subir backend em Docker
      - name: Start Backend
        run: |
          cd app
          docker compose up -d --build

          echo "Aguardando backend ficar pronto..."
          for i in {1..40}; do
            if curl -s http://localhost:9090/web/ >/dev/null; then
              echo "Backend OK"
              break
            fi
            echo "Backend ainda iniciando... ($i)"
            sleep 3
          done

      # Instalar Java
      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Instalar dependências Maven
      - name: Install Dependencies
        run: mvn -B install -DskipTests

      # Rodar testes Selenium (headless)
      - name: Run tests
        run: HEADLESS=true mvn -B test | tee test-output.log

      # Encerrar containers
      - name: Down Docker
        if: always()
        run: docker compose -f app/docker-compose.yml down -v

      # Exibir logs
      - name: Show logs
        if: always()
        run: cat test-output.log