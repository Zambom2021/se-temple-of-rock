name: Selenium Tests with Allure

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout do repositório de testes
      - name: Checkout test repo
        uses: actions/checkout@v3

      # Checkout do backend
      - name: Checkout backend repo
        uses: actions/checkout@v3
        with:
          repository: Zambom2021/temple-of-rock
          token: ${{ secrets.TEMPLE_TOKEN }}
          path: app

      # Subir backend em Docker
      - name: Start Backend
        run: |
          cd app
          docker compose up -d --build
          echo "Aguardando backend ficar pronto..."
          for i in {1..30}; do
            curl -s http://localhost:9090/health && break
            echo "Aguardando 3s..."
            sleep 3
          done

      # Instalar Java
      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Instalar Chrome
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      # Instalar dependências Maven
      - name: Install Dependencies
        run: mvn -B install -DskipTests

      # Rodar testes Selenium
      - name: Remove outdated ChromeDriver
        run: sudo rm -f /usr/bin/chromedriver

      - name: Run tests
        run: mvn -B test

      # Gerar Allure report
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # Upload resultados Allure
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # Upload relatório completo HTML
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      # Encerrar containers
      - name: Down Docker
        if: always()
        run: docker compose -f app/docker-compose.yml down -v
